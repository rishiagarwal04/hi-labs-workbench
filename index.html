<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiLabs Case Management Workbench · Prototype</title>
<style>
:root{
  --navy:#0B1F3A; --panel:#132B4F; --panel2:#16365F; --panel3:#1A3C70; --line:#2A4F86;
  --teal:#0A8C99; --teal2:#14B8C4; --teal3:#7FD6DD; --coral:#E0483B; --coral2:#FF6B5E; --amber:#F2A93B;
  --green:#2EC48A; --green2:#1E9E6A; --blue:#5B8CFF; --violet:#9B7BFF; --violet2:#6A4BC4;
  --card:#F4F7FB; --card2:#E9EFF7; --ink:#1B2A41; --muted:#5B6B80; --rule:#D5DEEA; --text:#E8F0FA; --dim:#9FB3CE;
  --serif:Cambria,Georgia,'Times New Roman',serif; --sans:Calibri,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.35}
body{min-height:100vh;background:
 radial-gradient(900px 600px at 92% -10%,rgba(20,184,196,.16),transparent 60%),
 radial-gradient(800px 600px at -8% 105%,rgba(46,196,138,.12),transparent 60%),var(--navy)}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);margin:0}
.top{position:sticky;top:0;z-index:20;background:rgba(11,31,58,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1640px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo{background:#fff;border-radius:8px;padding:3px 9px;font:800 19px var(--sans);letter-spacing:-.5px;color:#1B2A41}
.logo b{color:#2F62D0}
.brand small{color:var(--dim);font-size:12px;display:block;line-height:1.1}
.brand strong{font-family:var(--serif);font-size:16px}
.tabs{display:flex;gap:6px;flex:1}
.tab{background:var(--panel2);color:#8FA9CC;border:0;border-radius:7px;padding:8px 14px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.tab i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#0B1F3A;font-size:11px;color:var(--teal3)}
.tab:hover{color:#fff}
.tab.on{color:#0B1F3A}.tab.on i{background:#0B1F3A;color:#fff}
.tab[data-s=day].on{background:var(--amber)}.tab[data-s=ctx].on{background:var(--green)}.tab[data-s=act].on{background:var(--coral2)}.tab[data-s=logic].on{background:var(--teal2)}
.top-r{display:flex;gap:10px;align-items:center}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 12px;font-size:12.5px}
.pill:hover{border-color:var(--teal2)}
.asof{font-size:12px;color:var(--dim);text-align:right;line-height:1.25}
main{max-width:1640px;margin:0 auto;padding:20px 24px 60px}
.pt-strip{display:flex;gap:10px;margin-bottom:16px;align-items:stretch;flex-wrap:wrap}
.pt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 10px;display:flex;gap:10px;align-items:center;color:var(--text);text-align:left;min-width:215px}
.pt:hover{border-color:var(--teal2)}
.pt.on{background:var(--panel3);border-color:var(--teal2);box-shadow:0 0 0 2px rgba(20,184,196,.25)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--serif);color:#0B1F3A}
.pt b{display:block;font-size:14px}.pt small{color:var(--dim);font-size:11.5px}
.screen{display:none}.screen.on{display:block}
.h-row{display:flex;align-items:baseline;gap:14px;margin:4px 0 14px}
.h-row h1{font-size:28px}.h-row p{margin:0;color:var(--dim)}
.card{background:var(--card);color:var(--ink);border-radius:14px;border:1px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dark{background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text)}
.pad{padding:16px 18px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.dark .lbl{color:var(--teal3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:14px 18px;display:flex;align-items:center;gap:14px}
.kpi .n{font:700 38px var(--serif);color:var(--ink);min-width:58px}
.kpi .n.live{font-size:30px;color:var(--teal)}
.kpi b{display:block;font-size:14px}.kpi small{color:var(--muted);font-style:italic}
.grid-day{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.qhead,.qrow{display:grid;grid-template-columns:34px 112px 190px minmax(0,1fr) 150px 210px;gap:12px;align-items:center;padding:0 16px}
.qhead{background:var(--card2);height:34px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);border-radius:10px;margin:12px 12px 6px}
.qrow{margin:8px 12px;min-height:84px;background:#fff;border:1.5px solid var(--rule);border-radius:12px;cursor:pointer;transition:.15s;padding-top:10px;padding-bottom:10px}
.qrow:hover{border-color:var(--teal2);transform:translateY(-1px)}
.qrow.sel{border-color:#2F62D0;background:#EAF1FF;box-shadow:0 0 0 2px rgba(47,98,208,.18)}
.qrow.gone{opacity:.45}
.rank{width:28px;height:28px;border-radius:50%;background:var(--panel2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.band{display:inline-block;border-radius:8px;padding:7px 10px;font-weight:700;font-size:12.5px;text-align:center;width:100%}
.band.ts{background:var(--coral);color:#fff}.band.nr{background:var(--amber);color:#0B1F3A}.band.rn{background:var(--green2);color:#fff}
.mem b{display:block;font-size:15px}.mem small{color:var(--muted)}
.why{font-size:13px;color:#2b3a52}
.next{font-size:13px;font-weight:700;color:#0A6F7A}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#0B1F3A;background:#DCE3EE;opacity:.9}
.dot.t1.on{background:var(--coral2)}.dot.t2.on{background:var(--amber)}.dot.t3.on{background:var(--blue);color:#fff}.dot.t4.on{background:var(--teal2)}
.pts{margin-left:6px;font:700 17px var(--serif);color:var(--ink)}.pts small{font:600 10px var(--sans);color:var(--muted);margin-left:2px}
.foot-note{padding:6px 18px 16px;color:#B03A2E;font-weight:700;font-size:13px}
.rail .card{margin-bottom:16px}
.rail h3{font-size:19px}
.rail ul{margin:8px 0 0;padding-left:18px}.rail li{margin:3px 0;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-block;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.c-conf{background:#C4EEDA;color:#146B47}.c-hist{background:#E3E8EF;color:#46536A}.c-conflict{background:#FACFC9;color:#9A2A20}
.c-delay{background:#FBE3B0;color:#7A4D00}.c-unk{background:#FBE3B0;color:#7A4D00}.c-unav{background:#E3E8EF;color:#46536A}
.c-pend{background:#FBE3B0;color:#7A4D00}.c-fail{background:#FACFC9;color:#9A2A20}.c-rep{background:#E5DEFA;color:#5B3FB8}
.c-ok{background:#C4EEDA;color:#146B47}.c-blue{background:#D0DFFA;color:#1F4E8C}
.btn{border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:9px;padding:9px 14px;font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:#0b9faf}
.btn.dk{background:#0B1F3A;color:#fff;border-color:#0B1F3A}
.btn.ai{background:var(--violet2);border-color:var(--violet2);color:#fff;padding:11px 16px;font-size:14.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12.5px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ladder{padding:14px 16px}.ladder .row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--ink)}
.t-badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#0B1F3A}
.tag{border-radius:7px;padding:3px 8px;font-size:11px;font-weight:800;color:#0B1F3A}
/* context */
.ctx-head{padding:18px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ctx-head h2{font-size:30px}
.ctx-meta{color:var(--muted);font-size:13.5px}
.stamp{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.stamp div{background:var(--card2);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--muted)}.stamp b{display:block;color:var(--ink);font-size:13.5px}
.review{margin:14px 0;background:#FACFC9;color:#7a241b;border-radius:12px;padding:12px 18px;font-weight:700}
.grid-ctx{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:16px;align-items:start}
.snap .k{margin-top:12px}.snap .k b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:800}
.snap .k span{font-size:13.5px}
.tl-filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.f{border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{position:relative;margin:8px 0 0 6px;padding-left:22px;border-left:2px solid var(--rule)}
.ev{position:relative;background:#fff;border:1px solid var(--rule);border-radius:11px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.ev:before{content:"";position:absolute;left:-30px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--dot,#8FA3BF);border:2px solid #fff;box-shadow:0 0 0 1px var(--rule)}
.ev:hover{border-color:var(--teal2)}
.ev.hl{outline:3px solid var(--violet);animation:pulse 1.6s 2}
@keyframes pulse{50%{outline-color:transparent}}
.ev .d{font-size:12px;color:var(--muted);font-weight:700}
.ev .t{font-weight:700;font-size:14.5px;margin:1px 0}
.ev .s{font-size:12.5px;color:var(--muted)}
.ev .lim{display:none;margin-top:8px;border-top:1px dashed var(--rule);padding-top:7px;font-size:13px;color:#2b3a52}
.ev.open .lim{display:block}
.ev .evh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cflt{color:var(--ink);background:#FDECEA;border:1.5px solid var(--coral);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.cflt .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cflt .pair div{background:#fff;border-radius:9px;padding:8px 10px;text-align:center}
.cflt .pair b{display:block;font:700 22px var(--serif)}.cflt .pair small{color:var(--muted)}
.unk{color:var(--ink);background:#FFF6E2;border:1.5px solid var(--amber);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:13.5px}
.unk b{color:#7A4D00}
.legend{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;margin-top:8px;font-size:12.5px;align-items:center}
.na{margin:8px 0 0;padding:0;list-style:none}.na li{display:flex;gap:9px;margin:7px 0;font-size:13.5px}.na li i{font-style:normal;flex:0 0 22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
/* action */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:12px}
.step{border:0;color:#fff;background:#1F4E8C;padding:13px 10px 13px 26px;font:700 15px var(--serif);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);margin-right:-12px}
.step:first-child{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%)}
.step.on{background:var(--teal)}.step.doc.on{background:var(--coral)}
.step-detail{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.step-detail .card{padding:12px 16px;font-size:13.5px}.step-detail b{color:var(--teal)}.step-detail b.n{color:var(--coral)}
.banner{background:var(--coral);color:#fff;font-weight:700;text-align:center;border-radius:9px;padding:9px;margin-bottom:14px}
.grid-act{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:16px;align-items:start}
.rowkv{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px}.rowkv span{color:var(--muted)}
.outc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.oc{border:1px solid var(--rule);background:var(--card2);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:700;font-size:12.5px}
.oc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.blocked{background:#FACFC9;color:#7a241b;border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px;margin:8px 0}
.ai{position:relative;background:#F1ECFF;border:2px dashed var(--violet2);border-radius:14px;padding:14px 16px;overflow:hidden}
.ai:before{content:"AI-GENERATED";position:absolute;inset:auto auto 96px 50%;transform:translateX(-50%) rotate(-14deg);font:800 40px var(--serif);color:rgba(106,75,196,.07);white-space:nowrap;pointer-events:none}
.ai .badge{display:inline-flex;gap:6px;align-items:center;background:var(--violet2);color:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:800;letter-spacing:.04em}
.ai.signed{background:#EAF8F1;border-color:var(--green2)}.ai.signed:before{content:"SIGNED BY NURSE";color:rgba(30,158,106,.12)}
.ai .txt{margin:10px 0;font-size:14px;line-height:1.5;color:#1B2A41;min-height:120px}
.ai textarea{width:100%;min-height:190px;font:14px/1.5 var(--sans);border:1.5px solid var(--violet2);border-radius:9px;padding:10px;background:#fff;color:var(--ink)}
.cite{color:#2F62D0;font-weight:700;cursor:pointer;border-bottom:1px dotted #2F62D0}
.flag{background:#FBE3B0;color:#7A4D00;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;margin-bottom:10px}
.task{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px}
.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--teal);background:#fff;color:#fff;font-size:13px;display:grid;place-items:center;padding:0}
.task.done .chk{background:var(--teal)}
.task small{display:block;color:var(--muted)}
.ai-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.may{background:#C4EEDA;border-left:8px solid var(--green2);color:#10472f;border-radius:12px;padding:12px 16px;font-size:13.5px}
.mustnot{background:#FACFC9;border-left:8px solid var(--coral);color:#7a241b;border-radius:12px;padding:12px 16px;font-size:13.5px}
.may b,.mustnot b{display:block;margin-bottom:4px}
/* logic */
.grid-logic{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.formula{font:700 26px var(--serif);margin:6px 0 12px;letter-spacing:.2px}
.sl{display:grid;grid-template-columns:230px 1fr 40px;gap:12px;align-items:center;margin:9px 0;font-size:13.5px}
.sl b{font-family:var(--serif)}
input[type=range]{width:100%;accent-color:var(--teal2)}
.sc-row{display:grid;grid-template-columns:minmax(0,1.5fr) 30px 30px 30px 30px 120px 78px;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;font-size:13px}
.sc-row:nth-child(odd){background:rgba(255,255,255,.04)}
.sc-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal3);font-weight:800}
.rt{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:800;color:#0B1F3A}
.rt.Y{background:var(--teal2)}.rt.P{background:#3A6FA8;color:#fff}.rt.N{background:transparent;border:2px solid var(--coral2);color:#FF8A80}
.bar{display:flex;align-items:center;gap:6px}.bar i{display:block;height:8px;border-radius:5px}.bar span{font:700 13px var(--serif);min-width:32px;text-align:right}
.vd{border-radius:8px;padding:4px 0;text-align:center;font-size:11px;font-weight:800}
.vd.MUST{background:var(--green2);color:#fff}.vd.LATER{background:var(--amber);color:#0B1F3A}.vd.OUT{background:var(--coral);color:#fff}
.sep{border-top:2px dashed var(--amber);margin:6px 0}
.tally{display:flex;gap:10px;margin:10px 0}.tally div{flex:1;background:var(--panel2);border-radius:10px;padding:8px 12px;text-align:center}.tally b{font:700 26px var(--serif);display:block}
.mx-row{display:grid;grid-template-columns:30px 1fr 30px 30px 30px 30px 54px 100px;gap:8px;align-items:center;margin-top:8px;font-size:13px;padding:6px 8px;background:rgba(255,255,255,.05);border-radius:9px}
/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,25,.7);display:none;place-items:center;z-index:50}.modal-bg.on{display:grid}
.modal{background:#fff;color:var(--ink);border-radius:16px;padding:22px 24px;width:min(520px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:22px;margin-bottom:6px}.modal label{display:flex;gap:10px;margin:10px 0;font-size:14px;align-items:flex-start}
.modal select,.modal textarea{width:100%;padding:9px;border:1.5px solid var(--rule);border-radius:9px;font:inherit;margin-top:6px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#0B1F3A;border:1px solid var(--teal2);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:40;padding:70px 18px 18px;overflow:auto}
.drawer.on{transform:none}
.aud{border-left:3px solid var(--teal2);padding:4px 10px;margin:10px 0;font-size:13px}.aud small{color:var(--dim);display:block}
.hint{color:var(--dim);font-size:12.5px;margin:2px 0 14px}
@media (max-width:1280px){.grid-day,.grid-ctx,.grid-act,.grid-logic{grid-template-columns:1fr}.qhead{display:none}.qrow{grid-template-columns:30px 100px 1fr}.qrow .why,.qrow .next,.qrow .dotsc{grid-column:1/-1}.kpis{grid-template-columns:1fr 1fr}.tabs{overflow:auto}.top-in{flex-wrap:wrap}}

/* ===== v3 light reskin ===== */
:root{--bg:#EEF2F8;--shadow:0 1px 2px rgba(16,40,80,.06),0 6px 20px rgba(16,40,80,.07)}
html,body{background:var(--bg);color:var(--ink);font-size:16px}
body{background:linear-gradient(180deg,#F7F9FC 0,#EEF2F8 320px)}
.top{background:rgba(255,255,255,.96);border-bottom:1px solid var(--rule);box-shadow:0 1px 0 rgba(16,40,80,.03)}
.brand strong{color:var(--ink)}.brand small{color:var(--muted)}
.logo{border:1px solid var(--rule)}
.tabs{justify-content:center}
.tab{background:#F0F4FA;color:#4A5B73;padding:9px 16px;font-size:14px;border:1px solid transparent}
.tab i{background:#fff;color:var(--teal);border:1px solid var(--rule)}
.tab:hover{color:var(--ink);border-color:var(--rule)}
.tab.on,.tab[data-s].on{background:var(--ink);color:#fff}
.tab.on i{background:var(--teal2);color:#0B1F3A;border-color:transparent}
.pill{background:#fff;color:var(--ink);border-color:var(--rule)}.pill:hover{border-color:var(--teal)}
.asof{color:var(--muted)}
.pt{background:#fff;color:var(--ink);border-color:var(--rule);box-shadow:var(--shadow);border-radius:14px;padding:10px 16px 10px 10px}
.pt small{color:var(--muted)}
.pt.on{background:#E6F6F8;border-color:var(--teal);box-shadow:0 0 0 2px rgba(10,140,153,.18)}
.av{color:#0B1F3A}
.h-row h1{color:var(--ink);font-size:30px}.h-row p{color:var(--muted);font-size:15px}
.card{border:1px solid #E1E8F2;box-shadow:var(--shadow)}
.dark{background:#fff;color:var(--ink);border:1px solid #E1E8F2;box-shadow:var(--shadow)}
.dark .lbl{color:var(--teal)}
.guide{display:flex;gap:18px;align-items:center;background:#fff;border:1px solid #E1E8F2;border-left:5px solid var(--teal2);border-radius:12px;padding:12px 18px;margin:0 0 16px;box-shadow:var(--shadow);font-size:14.5px}
.guide b{color:var(--ink)}.guide .g1{flex:1}.guide .g2{flex:1;color:#0A6F7A}.guide .g2 b{color:#0A6F7A}
.kpi{padding:16px 20px}.kpi .n{font-size:40px}
.qrow{border-color:#E1E8F2}.qrow.sel{background:#EAF6F8;border-color:var(--teal);box-shadow:0 0 0 2px rgba(10,140,153,.15)}
.qhead{background:#F3F6FB}
.band{border-radius:999px;padding:6px 10px}
.rank{background:var(--ink)}
.why{font-size:13.5px}
.btn{border-radius:10px}
.step{background:#C9D6EA;color:#34465F}.step.on{background:var(--teal);color:#fff}.step.doc.on{background:var(--coral);color:#fff}
.sc-row:nth-child(odd){background:#F5F8FC}.sc-row{color:var(--ink)}
.sc-h{color:var(--teal)}
.rt.P{background:#CFE0F7;color:#1F4E8C}.rt.Y{background:#BDEFF3;color:#0A6F7A}.rt.N{border-color:var(--coral);color:var(--coral)}
.tally div{background:#F3F6FB;color:var(--ink)}
.mx-row{background:#F5F8FC;color:var(--ink)}
.formula{color:var(--ink)}
.drawer{background:#fff;color:var(--ink);border-left:1px solid var(--rule);box-shadow:-10px 0 40px rgba(16,40,80,.15)}
.aud small{color:var(--muted)}.hint{color:var(--muted)}
.drawer h3{color:var(--ink)}
.toast{background:var(--ink)}
.foot-note{color:#B03A2E}

:root{color-scheme:light}
.formula span:nth-of-type(1){color:#0A8C99!important}.formula span:nth-of-type(2){color:#1E9E6A!important}.formula span:nth-of-type(3){color:#6A4BC4!important}.formula span:nth-of-type(4){color:#C27A00!important}
.dark [style*="teal3"]{color:var(--teal)!important}
.dark .hint,.dark small{color:var(--muted)}
.sl small,.sl span{color:var(--muted)}
input[type=range]{accent-color:var(--teal)}

function engine(m){
  const adt=by('ADT_Events',m),cl=by('Clinical_Records',m),ap=by('Appointments_Authorisations',m),ct=by('Contact_History',m),sd=by('SDOH_Assessments',m);
  const why=[],f={t1:0,t2:0,t3:0,t4:0};
  adt.forEach(a=>{if(a.Event_Date_Time&&/discharge|ED visit/i.test(a.Event_Type)&&hrs(P(a.Event_Date_Time),NOW)<=24){f.t1=1;why.push(`${a.Event_Type} ${fmt(a.Event_Date_Time)} (${a.Data_Status.toLowerCase()})`)}});
  const cf=conflicts(m);cf.forEach(c=>{f.t2=1;why.push(`${c.med} ${c.items.map(i=>i.Dose).join(' vs ')}: sources disagree`)});
  cl.filter(r=>r.Availability_Status==='Pending').forEach(r=>{f.t2=1;why.push(`${r.Record_Type} pending`)});
  ap.filter(r=>/^AU/.test(r.Record_ID)&&r.Status==='Pending').forEach(r=>{f.t2=1;why.push(`${r.Service_or_Appointment} authorisation pending`)});
  ct.filter(r=>r.Outcome_Category==='Unsuccessful').forEach(r=>{if(!f.t3)why.push(`Outreach unsuccessful: ${r.Outcome_Detail.toLowerCase()}`);f.t3=1});
  sd.forEach(r=>{if(/access|caregiver/i.test(r.Domain)&&/Recent|Needs verification|Current/.test(r.Freshness_Status)&&!/^Contact/.test(r.Domain)){if(!f.t3)why.push(r.Domain.toLowerCase().includes('caregiver')?'Caregiver identity and permission incomplete':'Access barrier reported: '+r.Reported_Information.toLowerCase());f.t3=1}});
  sd.filter(r=>/^Stale/.test(r.Freshness_Status)).forEach(r=>{f.t4=1;why.push(`Social needs assessment ${r.Freshness_Status.toLowerCase()}`)});
  ap.filter(r=>!/^AU/.test(r.Record_ID)&&r.Status==='Pending').forEach(r=>{f.t4=1;why.push(`${r.Service_or_Appointment}: ${r.Status_Detail.toLowerCase()}`)});
  ap.filter(r=>r.Status==='Unknown').forEach(r=>why.push(`${r.Service_or_Appointment} ${fmt(r.Event_or_Appointment_Date,false)}: status unknown`));
  adt.filter(a=>a.Data_Status==='Delayed').forEach(a=>why.push(`ED alert received ${Math.floor(hrs(P(a.Event_Date_Time),P(a.Received_Date_Time)))} h after the event`));
  const pts=f.t1*8+f.t2*4+f.t3*2+f.t4*1;

  return {m,f,pts,band,why,conf:cf};
}

  by('Pharmacy_Medications',m).forEach(r=>{const st=cfIds.has(r.Medication_Record_ID)?'Conflict':/Member-reported/.test(r.Record_Type)?'Reported':/Historical|Prior/.test(r.Record_Type)?'Historical':'Confirmed';E.push({k:'Meds',id:r.Medication_Record_ID,date:r.Event_or_Record_Date,title:`${r.Medication} ${r.Dose} · ${r.Record_Type}`,st,src:r.Source,sub:`${r.Fill_or_Record_Status} · received ${fmt(r.Received_Date)}`,lim:`${r.Quality_or_Conflict}. ${r.Nurse_Interpretation}.`})});

  by('Labs',m).forEach(r=>E.push({k:'Labs',id:r.Lab_ID,date:r.Event_or_Collection_Date,title:r.Result?`${r.Test_Name} ${r.Result} ${r.Unit}`:r.Test_Name,st:r.Availability_Status==='Available'?'Confirmed':r.Availability_Status,src:r.Source,sub:`Collected ${fmt(r.Event_or_Collection_Date)} · received ${fmt(r.Received_Date)}`,lim:r.Interpretation_Limit}));
  by('Appointments_Authorisations',m).forEach(r=>E.push({k:'Appts',id:r.Record_ID,date:r.Event_or_Appointment_Date||r.Received_Date,title:r.Service_or_Appointment,st:r.Status,src:r.Source,sub:r.Status_Detail,lim:r.Interpretation_Limit}));
  by('Contact_History',m).forEach(r=>E.push({k:'Contact',id:r.Contact_ID,date:r.Contact_Date_Time,title:`${r.Channel} · ${r.Contact_Target}`,st:r.Outcome_Category==='Connected'?'Confirmed':r.Outcome_Category,src:'Contact history',sub:r.Outcome_Detail,lim:r.Next_Contact_Guidance}));

}

     ${[['D','Decision impact','Does it change the nurse’s next action?'],['V','Verifiability','Can we show source, dates and any conflict?'],['R','Caseload reach','Does it matter to a meaningful share of cases?'],['A','Availability','In standard feeds, at a lag we can display?']].map(([k,n,q])=>`<div class="sl"><span><b>${n}</b><br><small style="color:var(--dim)">${q}</small></span><input type="range" min="0" max="60" value="${S.w[k]}" data-w="${k}"><b>${S.w[k]}</b></div>`).join('')}
     <div class="hint">Rated Yes = 1, Partly = 0.5, No = 0. Hard gates: Decision = No or Verifiability = No means OUT whatever the score. MUST ≥ 70 · LATER 25–69 · OUT below 25.</div>
     <div class="tally"><div><b style="color:#2EC48A">${tally[0]}</b>MUST</div><div><b style="color:#F2A93B">${tally[1]}</b>LATER</div><div><b style="color:#FF8A80">${tally[2]}</b>OUT</div><button class="pill" data-wreset="1">Reset weights</button></div>
     <div class="sc-row sc-h"><span>Dataset</span><span>D</span><span>V</span><span>R</span><span>A</span><span>Score</span><span>Verdict</span></div>
     ${rows.map((x,i)=>`${i&&x.verdict!==rows[i-1].verdict?'<div class="sep"></div>':''}<div class="sc-row"><span>${esc(x.r[0])}${x.gate?' <small style="color:#FF8A80">· gate fails</small>':''}</span>${[1,2,3,4].map(j=>`<span class="rt ${x.r[j]}">${{Y:'1',P:'.5',N:'0'}[x.r[j]]}</span>`).join('')}<span class="bar"><i style="width:${x.s*.8}px;background:${x.verdict==='MUST'?'#1E9E6A':x.verdict==='LATER'?'#F2A93B':'#E0483B'}"></i><span>${(Math.round(x.s*10)/10)}</span></span><span class="vd ${x.verdict}">${x.verdict}</span></div>`).join('')}
   </div>
   <div class="dark pad"><div class="lbl">Queue points · live from the five patients’ data</div>
     <div class="formula" style="font-size:22px">Points = 8·T1 + 4·T2 + 2·T3 + 1·T4</div>
     <div class="hint">T1 event or due date today (last 24 h) · T2 conflict or pending clinical item · T3 blocked outreach or access barrier · T4 overdue or unowned task. Ties are broken by language and interpreter lead time.</div>
     <div class="mx-row sc-h" style="background:none"><span></span><span>Member</span><span>1</span><span>2</span><span>3</span><span>4</span><span>Pts</span><span>Band</span></div>
     ${R.map((e,i)=>`<div class="mx-row"><span class="rank">${i+1}</span><span><b>${esc(memName(e.m))}</b></span>${[1,2,3,4].map(t=>`<span class="dot t${t} ${e.f['t'+t]?'on':''}" style="margin:auto">${e.f['t'+t]?'●':''}</span>`).join('')}<span style="font:700 18px var(--serif);text-align:center">${e.pts}</span><span class="band ${bandCls(e.band)}" style="font-size:11px;padding:5px">${e.band}</span></div>`).join('')}
     <div class="hint" style="margin-top:14px"><b style="color:var(--teal3)">Why 8·4·2·1?</b> The weights are powers of two, so a higher tier always outranks all lower tiers combined (8 &gt; 4+2+1). The nurse can always see the points and challenge them.</div>
     <div class="hint">Not a clinical risk score. Evidence quality never adds urgency: weak data adds a “verify” action instead.</div>
   </div>
  </div>`;
}
/* ---------- modals ---------- */
function modal(html){$('#modal').innerHTML=html;$('#modalBg').classList.add('on')}
function closeModal(){$('#modalBg').classList.remove('on')}
function reasonModal(kind,m){
  const opts=kind==='dismiss'?['Already resolved outside the workbench','Duplicate of another case','Member no longer on my caseload','Priority looks wrong (explain)']:['Waiting for callback window','Waiting for pharmacy or provider','Member asked to be contacted later'];
  modal(`<h3>${kind==='dismiss'?'Dismiss':'Snooze'} ${esc(memName(m))}?</h3><p style="margin:0;color:var(--muted)">A reason is required. Reasons feed the signal-tuning loop.</p><select id="rsn">${opts.map(o=>`<option>${o}</option>`).join('')}</select><textarea id="rsnT" rows="2" placeholder="Optional note"></textarea><div class="acts"><button class="btn" data-close="1">Cancel</button><button class="btn pri" data-confirm="${kind}:${m}">Confirm</button></div>`);
}
function approveModal(m){
  modal(`<h3>Review &amp; approve the AI draft</h3><p style="margin:0 0 6px;color:var(--muted)">${esc(memName(m))} · nothing is saved until you approve.</p>
   <label><input type="checkbox" class="ack"> I checked each cited source ID against the evidence timeline</label>
   <label><input type="checkbox" class="ack"> I removed or corrected anything the sources do not support</label>
   <label><input type="checkbox" class="ack"> I understand that I am accountable for this note</label>
   <div class="acts"><button class="btn" data-close="1">Back to edit</button><button class="btn pri" id="signBtn" disabled data-sign="${m}">Approve &amp; sign</button></div>`);
}
/* ---------- events ---------- */
function go(s){S.screen=s;draw()}
function draw(){chrome();({day:renderDay,ctx:renderCtx,act:renderAct,logic:renderLogic})[S.screen]();
  if(S.hl){const el=document.getElementById('ev-'+S.hl);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>{S.hl=null},2500)}}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-pid],[data-sel],[data-band],[data-filter],[data-ev],[data-step],[data-out],[data-call],[data-edit],[data-approve],[data-sign],[data-unsign],[data-task],[data-cite],[data-open],[data-snooze],[data-dismiss],[data-confirm],[data-close],[data-w],[data-wreset]');
  if(!t){if(ev.target.id==='modalBg')closeModal();return}
  const d=t.dataset;
  if(d.go){go(d.go);window.scrollTo(0,0)}
  else if(d.pid){S.pid=d.pid;S.sel=d.pid;S.filter='All';S.editing=false;draw()}
  else if(d.sel){S.sel=d.sel;S.pid=d.sel;draw()}
  else if(d.band){S.band=d.band;draw()}
  else if(d.filter){S.filter=d.filter;draw()}
  else if(d.ev){S.tlOpen[d.ev]=!S.tlOpen[d.ev];draw()}
  else if(d.step!==undefined){S.step=+d.step;draw()}
  else if(d.out){S.outcomes[S.pid]=d.out;log('Case Manager',`Logged outreach outcome “${d.out}” for ${memName(S.pid)}`,'Outcome recorded');toast('Outcome logged · '+d.out);draw()}
  else if(d.call){if(t.dataset.blocked){toast('Blocked: caregiver is not authorised. Confirm permission first.');log('System',`Blocked caregiver contact for ${memName(S.pid)}`,'Caregiver not authorised')}else{toast(d.call==='member'?'Call placed through the approved process':'Caregiver contact recorded');log('Case Manager',`Started ${d.call} outreach for ${memName(S.pid)}`,'Approved process')}}
  else if(d.edit){if(S.editing){S.drafts[S.pid]=$('#draftTa').value;S.editing=false;log('Case Manager',`Edited AI draft for ${memName(S.pid)}`,'Nurse edit')}else S.editing=true;draw()}
  else if(d.approve){if(S.editing)S.drafts[S.pid]=$('#draftTa').value,S.editing=false;approveModal(S.pid)}
  else if(d.sign){S.signed[d.sign]='by Case Manager at 08:'+String(20+S.audit.length).padStart(2,'0');S.tasks[d.sign+'-tn']=true;log('Case Manager',`Approved and signed AI note for ${memName(d.sign)}`,'Nurse reviewed sources');closeModal();toast('Note signed. It is now part of the record.');draw()}
  else if(d.unsign){delete S.signed[S.pid];S.tasks[S.pid+'-tn']=false;log('Case Manager',`Reopened note for ${memName(S.pid)}`,'Nurse reopened');draw()}
  else if(d.task){S.tasks[d.task]=!S.tasks[d.task];log('Case Manager',`${S.tasks[d.task]?'Completed':'Reopened'} task ${d.task}`,'Task update');draw()}
  else if(d.cite){S.screen='ctx';S.filter='All';S.hl=d.cite;S.tlOpen[d.cite]=true;draw()}
  else if(d.open){S.pid=d.open;go('ctx')}
  else if(d.snooze)reasonModal('snooze',d.snooze);
  else if(d.dismiss)reasonModal('dismiss',d.dismiss);
  else if(d.confirm){const[k,m]=d.confirm.split(':');const r=$('#rsn').value;const n=$('#rsnT').value;(k==='dismiss'?S.gone:S.snooze)[m]=true;log('Case Manager',`${k==='dismiss'?'Dismissed':'Snoozed'} ${memName(m)}`,r+(n?': '+n:''));closeModal();toast((k==='dismiss'?'Dismissed':'Snoozed')+' with reason logged');draw()}
  else if(d.close)closeModal();
  else if(d.wreset!==undefined){S.w={D:35,V:25,R:20,A:20};draw()}
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.w){S.w[t.dataset.w]=+t.value;const pos=t.selectionStart;draw();const el=document.querySelector(`[data-w=${t.dataset.w}]`);el&&el.focus()}
  if(t.classList.contains('ack')){$('#signBtn').disabled=![...document.querySelectorAll('.ack')].every(c=>c.checked)}});
document.addEventListener('change',ev=>{if(ev.target.id==='sortSel'){S.sort=ev.target.value;draw()}});
$('#audBtn').onclick=()=>{const dr=$('#drawer');dr.classList.toggle('on');$('#audList').innerHTML=S.audit.length?S.audit.map(a=>`<div class="aud"><b>${esc(a.what)}</b><small>${a.t.getHours()}:${String(a.t.getMinutes()).padStart(2,'0')} · ${esc(a.who)} · ${esc(a.why)}</small></div>`).join(''):'<p class="hint">No actions yet. Dismiss a case, log an outcome or sign a note.</p>'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#drawer').classList.remove('on')}});
$('#resetBtn').onclick=()=>{S=S0();$('#audN').textContent=0;$('#drawer').classList.remove('on');draw();toast('Demo reset')};
draw();
const q=new URLSearchParams(location.search);if(q.get('s')){S.screen=q.get('s');if(q.get('p')){S.pid=q.get('p');S.sel=q.get('p')}draw()}
</script>
</body>
</html>
